name: PR WebUI check

on:
  push:
    branches: [feat/gradio-french]

jobs:
  webui-i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Compile changed Python
        run: python -m py_compile webui.py videotrans/webui_i18n.py tests/test_webui_i18n.py
      - name: Ruff new files
        run: ruff check videotrans/webui_i18n.py tests/test_webui_i18n.py
      - name: Ruff critical WebUI checks
        run: ruff check --select E9,F63,F7,F82 webui.py
      - name: Ruff format new files
        run: ruff format --check videotrans/webui_i18n.py tests/test_webui_i18n.py
      - name: Focused tests
        run: pytest -q tests/test_webui_i18n.py
